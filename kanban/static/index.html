<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>李迦一 · 学习看板</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <h1>📚 李迦一 · 学习看板</h1>
    <div class="date-nav">
      <button class="date-btn" id="datePrev" title="前一日">‹</button>
      <input type="date" id="datePicker" class="date-input">
      <button class="date-btn" id="dateNext" title="后一日">›</button>
      <button class="date-btn-today" id="dateToday">今天</button>
    </div>
  </div>
  <div class="topbar-right">
    <span class="version-info" id="versionInfo" title="当前版本" style="display:none"></span>
    <span class="status-info" id="statusInfo" title="云端与 GitHub 版本对齐状态" style="display:none"></span>
    <button class="sync-btn" id="syncBtn" style="display:none" title="从 GitHub 拉取最新代码并重启">⟳ 同步最新版</button>
    <button class="restore-btn" id="restoreBtn" style="display:none" title="从备份 zip 恢复云端数据">⬆ 恢复数据</button>
    <input type="file" id="restoreFile" accept=".zip" style="display:none">
    <div class="member-switch" id="memberSwitch"></div>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="kanban">📋 今日看板</button>
  <button class="tab" data-view="todo">🔔 待处理 <span class="badge" id="todoBadge">0</span></button>
  <button class="tab" data-view="review">🔁 复习 <span class="badge" id="reviewBadge">0</span></button>
  <button class="tab" data-view="wrongbook">❌ 错题本</button>
  <button class="tab" data-view="knowledge">🧭 知识点</button>
</nav>

<main id="app">
  <!-- 看板视图 -->
  <section class="view active" id="view-kanban"></section>

  <!-- 待处理视图 -->
  <section class="view" id="view-todo"></section>

  <!-- 复习视图 -->
  <section class="view" id="view-review"></section>

  <!-- 错题本视图 -->
  <section class="view" id="view-wrongbook"></section>

  <!-- 知识点视图 -->
  <section class="view" id="view-knowledge"></section>
</main>

<!-- 板块详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2 id="drawerTitle"></h2>
    <button class="icon-btn" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- 左右分屏错题审核弹窗 -->
<div class="review-modal-mask" id="reviewModalMask"></div>
<div class="review-modal" id="reviewModal">
  <div class="review-modal-header">
    <div class="review-modal-title">
      <span id="reviewModalSubject">语文</span> · <span id="reviewModalBoard">校内精练</span>
      <span class="review-modal-sub" id="reviewModalMeta">2026-09-04 · 2 张照片 · 3 题待审</span>
    </div>
    <div class="review-modal-actions">
      <button class="btn btn-sm" id="btnRerunAll" title="整批打回：让 AI 重新看照片识别全部题目。适合 AI 漏题、整页没识别出来的情况。当前审核结果会归档为历史版本，AI 重跑后回到待审。">🔄 全部重新识别</button>
      <button class="btn btn-sm" id="btnPrintPreview" title="只显示题目，隐藏答案，方便打印">🖨 打印版预览</button>
      <button class="btn btn-sm" id="btnCloseReviewModal">关闭</button>
    </div>
  </div>
  <div class="review-modal-body">
    <!-- 整批打回内联表单（默认折叠，点"🔄 全部重新识别"展开）。不用 prompt()，
         保证左侧照片永远可见，能边看图边写意见 -->
    <div id="rerunAllBox" class="rerun-all-box">
      <div class="rerun-all-title">🔄 整批打回重识别</div>
      <div class="rerun-all-tip">请说明漏了哪些题 / 哪里没识别出来，会一起发给 AI（可选）：</div>
      <textarea id="rerunAllComment" rows="3" placeholder="例：漏题，第六题的4. 有错误"></textarea>
      <div class="rerun-all-actions">
        <button class="btn btn-danger" id="rerunAllConfirm">打回</button>
        <button class="btn btn-sm" id="rerunAllCancel">取消</button>
      </div>
    </div>
    <div class="review-modal-left" id="reviewModalLeft">
      <!-- 左侧照片区 -->
    </div>
    <div class="review-modal-right" id="reviewModalRight">
      <!-- 右侧错题编辑区 -->
    </div>
  </div>
</div>

<!-- 打印版预览弹窗 -->
<div class="print-modal-mask" id="printModalMask"></div>
<div class="print-modal" id="printModal">
  <div class="print-modal-header">
    <h3>🖨 打印版预览（仅题目，隐藏答案）</h3>
    <button class="icon-btn" id="btnClosePrintModal">✕</button>
  </div>
  <div class="print-modal-body" id="printModalBody"></div>
  <div class="print-modal-footer">
    <button class="btn btn-primary" id="btnDoPrint">打印 / 另存为 PDF</button>
    <button class="btn" id="btnClosePrintModal2">关闭</button>
  </div>
</div>

<!-- 作业上传弹窗（按知识点，可滞后补交） -->
<div class="hw-modal-mask" id="hwModalMask"></div>
<div class="hw-modal" id="hwModal">
  <div class="hw-modal-header">
    <h3>📚 上传作业</h3>
    <button class="icon-btn" id="btnCloseHwModal">✕</button>
  </div>
  <div class="hw-modal-body">
    <div class="field">
      <label>科目板块 <span class="tip">（练习册 / 听写 / 作文等）</span></label>
      <select id="hwBoard"></select>
    </div>
    <div class="field">
      <label>知识点 <span class="tip">（按校内目录，如「第一单元 · 1 观潮」）</span></label>
      <select id="hwKp"><option value="">未指定</option></select>
    </div>
    <div class="field">
      <label>作业完成日期 <span class="tip">（滞后补交：交老师批改后上传，日期可早于今天）</span></label>
      <input type="date" id="hwDate">
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <textarea id="hwNote" placeholder="如：练习册 P12-P15，第3题空着没做"></textarea>
    </div>
    <div class="field">
      <label>作业照片</label>
      <div class="photo-grid" id="hwPhotoPreview"></div>
      <input type="file" id="hwPhotoInput" accept="image/*" multiple capture="environment" style="display:none">
      <button class="btn btn-sm" id="btnHwPickPhoto" style="margin-top:8px">＋ 选择照片</button>
    </div>
  </div>
  <div class="hw-modal-footer">
    <button class="btn" id="btnCancelHw">取消</button>
    <button class="btn btn-primary" id="btnSubmitHw">上传作业</button>
  </div>
</div>

<!-- 知识点作业历史（从知识点全景图的 chip 点进来）
     层级 125/126：低于「上传作业」弹窗(130/131)，所以点「上传新作业」能盖在本弹窗之上 -->
<div class="kphw-modal-mask" id="kpHwMask"></div>
<div class="kphw-modal" id="kpHwModal">
  <div class="hw-modal-header">
    <h3>📚 作业历史</h3>
    <button class="icon-btn" id="btnCloseKpHw">✕</button>
  </div>
  <div class="hw-modal-body" id="kpHwBody"></div>
  <div class="hw-modal-footer">
    <button class="btn" id="btnCloseKpHw2">关闭</button>
    <button class="btn btn-primary" id="btnKpHwUpload">📤 上传新作业</button>
  </div>
</div>

<!-- 提示 -->
<div class="toast" id="toast"></div>

<!-- 打印列表浮动按钮（右下角）。N=0 时隐藏。
     点击 → 弹打印预览弹窗（按学科自动分组排版），可直接走 window.print() -->
<button id="printFab" class="print-fab" title="查看打印列表，按学科自动排版" style="display:none">
  🖨 打印列表 (<span id="printFabCount">0</span>)
</button>

<script src="/static/app.js"></script>
</body>
</html>
